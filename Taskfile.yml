version: '3'

# Hosts and signing identity stay out of this public repo: see .release.env.example.
dotenv: ['.release.env']

includes:
  # signing and uploading need our Mac and download server: task maint:…
  maint:
    taskfile: ./taskfiles/maintainer.yml
    dir: .

vars:
  VERSION:
    sh: cat VERSION
  LDFLAGS: -s -w -X main.version={{.VERSION}}

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build bin/gitpulse with the version from VERSION
    cmds:
      - go build -ldflags="{{.LDFLAGS}}" -trimpath -o bin/gitpulse{{exeExt}} ./cmd/gitpulse
      - ./bin/gitpulse{{exeExt}} --version

  install:
    desc: Build and install gitpulse and its manpage for the current user (PREFIX=~/.local; Linux, macOS)
    platforms: [linux, darwin]
    deps: [build]
    silent: true
    vars:
      PREFIX: '{{.PREFIX | default (printf "%s/.local" .HOME)}}'
    cmds:
      - install -d "{{.PREFIX}}/bin" "{{.PREFIX}}/share/man/man1"
      - install -m 0755 bin/gitpulse "{{.PREFIX}}/bin/gitpulse"
      - install -m 0644 docs/gitpulse.1 "{{.PREFIX}}/share/man/man1/gitpulse.1"
      - echo "Installed {{.PREFIX}}/bin/gitpulse and man page gitpulse(1)"
      - |
        case ":$PATH:" in
          *":{{.PREFIX}}/bin:"*) "{{.PREFIX}}/bin/gitpulse" --version ;;
          *) echo "Note: {{.PREFIX}}/bin is not in PATH — add to your shell profile:"
             echo "  export PATH=\"{{.PREFIX}}/bin:\$PATH\"" ;;
        esac

  uninstall:
    desc: Remove gitpulse and its manpage installed by `task install` (config in ~/.gitpulsemlc stays)
    platforms: [linux, darwin]
    silent: true
    vars:
      PREFIX: '{{.PREFIX | default (printf "%s/.local" .HOME)}}'
    cmds:
      - rm -f "{{.PREFIX}}/bin/gitpulse" "{{.PREFIX}}/share/man/man1/gitpulse.1"
      - echo "Removed gitpulse from {{.PREFIX}}; your config ~/.gitpulsemlc/ is untouched"

  build:remote:
    desc: Build the remote execution utility (bin/remote_gitpulse)
    cmds:
      - go build -ldflags="{{.LDFLAGS}}" -o bin/remote_gitpulse{{exeExt}} ./cmd/remote

  build:cross:
    desc: Cross-compile gitpulse for all platforms into bin/ (used by remote_gitpulse)
    cmds:
      - for: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
        cmd: >-
          GOOS={{splitList "/" .ITEM | first}} GOARCH={{splitList "/" .ITEM | last}}
          go build -ldflags="{{.LDFLAGS}}" -trimpath
          -o bin/gitpulse-{{splitList "/" .ITEM | first}}-{{splitList "/" .ITEM | last}}{{if hasPrefix "windows" .ITEM}}.exe{{end}}
          ./cmd/gitpulse

  dev:
    desc: Run gitpulse from source (task dev -- --compact)
    cmds:
      - go run ./cmd/gitpulse {{.CLI_ARGS}}

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  lint:
    desc: Check formatting and run go vet
    cmds:
      - test -z "$(gofmt -l cmd internal pkg)" || (gofmt -l cmd internal pkg && exit 1)
      - go vet ./...

  vuln:
    desc: Check dependencies and the Go toolchain for known vulnerabilities
    preconditions:
      - sh: command -v govulncheck
        msg: "govulncheck missing: go install golang.org/x/vuln/cmd/govulncheck@latest"
    cmds:
      - govulncheck ./...

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  release:snapshot:
    desc: Build all release archives and packages locally into dist/ (no upload)
    preconditions:
      - sh: command -v goreleaser
        msg: "goreleaser missing: https://goreleaser.com/install/"
    cmds:
      - goreleaser release --snapshot --clean

  clean:
    desc: Remove bin/ and dist/
    cmds:
      - rm -rf bin dist
